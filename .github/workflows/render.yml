name: render
on:
  push:
    paths: ['jobs/**']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Programas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
      - name: Renderizar
        id: r
        env:
          HYPERFRAMES_NO_UPDATE_CHECK: '1'
          HYPERFRAMES_SKIP_SKILLS: '1'
          HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
        run: |
          arquivo=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- jobs/ | grep '\.tgz$' | head -1)
          if [ -z "$arquivo" ]; then echo "Nenhum job novo."; exit 0; fi
          id=$(basename "$arquivo" .tgz)
          mkdir -p "trabalho" "saida"
          tar -xzf "$arquivo" -C trabalho
          cd trabalho
          npx --yes hyperframes render -o "$GITHUB_WORKSPACE/saida/video.mp4" -q "${QUALIDADE:-standard}" -f 30 -w 2
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.r.outputs.id != ''
        with:
          name: video-${{ steps.r.outputs.id }}
          path: saida/video.mp4
          retention-days: 1
